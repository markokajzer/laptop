model = "gpt-5.6-sol"
model_reasoning_effort = "xhigh"
model_verbosity = "low"
model_reasoning_summary = "concise"
personality = "pragmatic"
model_auto_compact_token_limit = 250000

notify = ["/Users/marko/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient", "turn-ended", "--previous-notify", "[\"bash\",\"\\/Users\\/marko\\/.claude\\/hooks\\/peon-ping\\/adapters\\/codex.sh\"]"]

[features]
rmcp_client = true
js_repl = false
memories = false
chronicle = false

[desktop]
ambient-suggestions-enabled = true
appearanceTheme = "system"
appearanceLightCodeThemeId = "notion"
appearanceDarkCodeThemeId = "codex"
sansFontSize = 14
codeFontSize = 16
followUpQueueMode = "queue"
preventSleepWhileRunning = true
keepRemoteControlAwakeWhilePluggedIn = true
git-branch-prefix = "marko/"
git-always-force-push = true
git-pull-request-merge-method = "squash"
git-show-sidebar-pr-icons = true
git-commit-instructions = """
If we start from a Linear task, do not mention task in branch name or commit message.

If we do followups / cleanups on an existing commit, do not create a separate commit, ammend the previous commit instead.

commit messages should be all lowercase.

do not write the subject of the in brackets, e.g. `[subject] description`, use a simple colon instead, e.g. `subject: description`.

do not do any early / continuous pushes, there's likely gonna be followups."""
git-pr-instructions = """
## title

if the PR has only a single commit, use the commit message as the PR title.

## linear

If we start from a Linear task, do not mention task in branch name or commit message, mention the task link in the PR instead as the first thing in the description instead.
Examples:
1. If task **closes** a PR, write `closes <link>`
2. If task is **only part** of a PR, and there might be followups, write `part of <link>`

## sections

use sections in the description, e.g. `## scope`, `## test`, `## deployment`, `## caveats`, `## followups` or similar. DO NOT use a section if there is nothing meaningful to say/add about it. use bullet points. be concise and to the point.

in the `scope` section, do not list every single detail of what we did, just concisely explain the purpose of the PR.

in the `test` section, DO NOT explain how to run the tests, they are automatically run by CI. if anything, explain how to test the feature / bug fix / edge case through the UI.

in the `deployment` section, describe if there's any infrastructure dependencies or dependencies on other deployments / pull requests. Skip if none.

in the `followups` section, describe if anything else needs to be done.
"""
notifications-turn-mode = "always"
conversationDetailMode = "STEPS_COMMANDS"
dock-icon-preference = "app-default"
reviewDelivery = "detached"

